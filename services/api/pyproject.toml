[project]
name = "kisanai-c2c-api"
version = "0.1.0"
description = "KISANAI C2C regenerative agricultural intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "requests>=2.32,<3",
  "google-auth>=2.35,<3",
  "google-genai>=1.0,<2",
  "google-cloud-firestore>=2.18,<3",
  "google-cloud-storage>=2.18,<4",
  "google-cloud-speech>=2.27,<3",
  "google-cloud-texttospeech>=2.17,<3",
  "earthengine-api>=1,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.2,<9", "ruff>=0.6,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kisanai_c2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
