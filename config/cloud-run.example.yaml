# Example env-vars file for one production node:
#   gcloud run deploy <service> --source . --env-vars-file config/cloud-run.local.yaml ...
# Copy to config/cloud-run.local.yaml (git-ignored) and fill in the blanks.
APP_ENV: "production"
NODE_ID: "india-node-mh"
NODE_COUNTRY_CODE: "IN"
NODE_LABEL: "Maharashtra and Uttar Pradesh node"
NODE_SUBDIVISIONS: "IN-MH,IN-UP"
PUBLIC_BASE_URL: "https://<service>-<project-number>.asia-south1.run.app"
PEER_NODES: "https://<peer-service>-<project-number>.asia-south1.run.app"
EXPERT_ACCESS_TOKEN: "<long random code for officers>"

# Durable storage (enable the Firestore API and create the database and bucket first)
STORE_PROVIDER: "firestore"
FIRESTORE_DATABASE: "kisanai-c2c"
MEDIA_PROVIDER: "gcs"
MEDIA_BUCKET: "<project-id>-kisanai-media"

GOOGLE_CLOUD_PROJECT: "<project-id>"
AI_ENABLED: "true"
AI_PROVIDER: "vertex"
VERTEX_LOCATION: "asia-south1"
GEMINI_MODEL: "gemini-3.5-flash"
GEMINI_FALLBACK_MODEL: "gemini-3.7-flash"
GEMINI_FALLBACK_LOCATION: "global"

OPEN_METEO_ENABLED: "true"
EARTH_ENGINE_ENABLED: "true"
SPEECH_ENABLED: "true"
IMD_ENABLED: "true"
